events {
    worker_connections 1024;
}

http {
    # Monolitik backend servisimiz
    upstream backend_api {
        server vip-backend:8080; 
    }

    server {
        listen 80;

        # Genel Proxy Ayarları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ---------------------------------------------------------
        # MİKROSERVİS SİMÜLASYONU (API GATEWAY ROUTING)
        # Bütün servisler şu an monolith'e (backend_api) gidiyor.
        # Trailing slash (/) kaldırıldı ki 301 yönlendirmesi olmasın.
        # ---------------------------------------------------------

        # 1. Auth Service
        location /api/auth {
            proxy_pass http://backend_api;
        }

        # 2. User Service
        location /api/users {
            proxy_pass http://backend_api;
        }

        # 3. Reservation Service
        location /api/reservations {
            proxy_pass http://backend_api;
        }

        # 4. Vehicle & Pricing Services
        location /api/vehicles {
            proxy_pass http://backend_api;
        }
        location /api/pricing-zones {
            proxy_pass http://backend_api;
        }
        location /api/pricing-rules {
            proxy_pass http://backend_api;
        }

        # 5. Notification & Firebase Services
        location /api/notifications {
            proxy_pass http://backend_api;
        }
        location /api/notification-preferences {
            proxy_pass http://backend_api;
        }
        location /api/firebase-installations {
            proxy_pass http://backend_api;
        }

        # 6. Diğer Servisler (Loyalty, Translations, Campaigns vb.)
        location /api/loyalty {
            proxy_pass http://backend_api;
        }
        location /api/translations {
            proxy_pass http://backend_api;
        }
        location /api/campaigns {
            proxy_pass http://backend_api;
        }

        # Geri kalan tüm API isteklerini yakala (Fallback)
        location /api/ {
            proxy_pass http://backend_api;
        }

        # ---------------------------------------------------------
        # FRONTEND YÖNLENDİRMESİ
        # ---------------------------------------------------------
        location / {
            proxy_pass http://frontend-service;
        }
    }
}