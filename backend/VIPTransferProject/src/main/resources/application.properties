# ── .env Dosyası Yükleme ─────────────────────────────────────────────────────
spring.config.import=optional:file:.env[.properties]

# ── Genel Uygulama Ayarları ──────────────────────────────────────────────────
spring.application.name=transferProject
spring.main.allow-bean-definition-overriding=true
server.port=8080

# ── Veritabanı Ayarları ──────────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ── SQL Başlatma ─────────────────────────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/create-types.sql
spring.sql.init.separator=;;

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# Terminalde SQL sorgularını görmek istiyorsan true, gizlemek istiyorsan false yap:
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Mail (Gmail SMTP — MAIL_KURULUM.md'ye bak) ───────────────────────────────
# Mail olmayan ortamlarda app.email.enabled=false bırakın, diğerleri boş kalabilir.
app.email.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Firebase Push
# Credentials olmayan ortamlarda false kalır ve backend normal şekilde açılır.
app.firebase.enabled=${FIREBASE_ENABLED:false}

# ── Uygulama URL (mail linkleri için — aynı WiFi'de erişim için IP'ye çek) ───

# ── Google Maps ──────────────────────────────────────────────────────────────
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# ── Actuator & İzleme (Monitoring) ───────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=transferProject

# İleti Merkezi SMS
app.sms.enabled=${SMS_ENABLED:false}
iletimerkezi.api-url=${ILETIMERKEZI_API_URL:}
iletimerkezi.api-key=${ILETIMERKEZI_API_KEY:}
iletimerkezi.api-hash=${ILETIMERKEZI_API_HASH:}
iletimerkezi.sender=${ILETIMERKEZI_SENDER:}

# WhatsApp
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}
whatsapp.api-version=${WHATSAPP_API_VERSION:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
